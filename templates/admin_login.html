<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar | Sushi Maré</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo"><a class="logo" href="{{ url_for('index') }}">Sushi Maré</a></header>
  <main class="confirmacao">
    <h1>Área do restaurante</h1>
    {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
    <form class="dados" method="post">
      <label>Senha <input name="senha" type="password" required autofocus></label>
      <button class="btn btn-grande" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
